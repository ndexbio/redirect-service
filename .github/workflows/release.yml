name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Release Jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check tag matches pom.xml version
        run: |
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "${pom_version}" != "${tag_version}" ]; then
            echo "::error title=Release tag mismatch::Tag ${GITHUB_REF_NAME} resolves to version ${tag_version}, but pom.xml version is ${pom_version}."
            exit 1
          fi

          if [[ "${pom_version}" == *-SNAPSHOT ]]; then
            echo "::error title=Snapshot release version::pom.xml version must not include -SNAPSHOT for a release."
            exit 1
          fi

      - name: Build jar
        run: mvn -B clean package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/redirect-service-*-jar-with-dependencies.jar \
            --verify-tag \
            --generate-notes
